name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, fidelity & tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            server/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Install app dependencies
        run: npm ci
        working-directory: app

      - name: Typecheck and build frontend
        run: npm run app:build

      # Roadmap content is licensed by roadmap.sh and never committed — fetch
      # just the frontend snapshot the fidelity guard needs (from the source).
      - name: Fetch fidelity fixture roadmap
        run: node scripts/bootstrap-content.mjs --only=frontend

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The project's core promise is byte-exact rendering. This guard needs no
      # browser and no running server, so it gates every change.
      - name: Renderer fidelity guard
        run: python scripts/verify_edges.py

      - name: Test suite
        run: npm test
